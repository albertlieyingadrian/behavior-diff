[build-system]
# Keep the upper bound: uv_build follows uv's versioning and may change between minors.
requires = ["uv_build>=0.11.7,<0.14"]
build-backend = "uv_build"

[project]
name = "behavior-diff"
# The ONLY place the version lives. Code reads it with importlib.metadata.
version = "0.1.0"
description = "What did my fine-tune change? Sample two model versions on the same prompts, have a judge describe the differences, name them as categories, and test each one against a same-model control."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Albert Lie" }]
keywords = ["llm", "evaluation", "model-diffing", "behavior", "auditing", "fine-tuning", "self-improvement"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
# Standard library only: HTTP to any OpenAI-compatible endpoint through urllib.
dependencies = []

[project.optional-dependencies]
# Sample a Tinker checkpoint or base model (tinker://, tinker-base:).
tinker = ["tinker>=0.33"]
# Sample with vLLM on a Modal GPU (modal:).
modal = ["modal>=1.0"]
# Sample locally with transformers (hf:), with an optional PEFT adapter.
hf = ["torch>=2.4", "transformers>=4.51", "peft>=0.15", "huggingface-hub>=0.30"]
dev = ["pytest>=9.0", "ruff>=0.17", "mypy>=2.0"]

[project.scripts]
bdiff = "bdiff.cli:main"
behavior-diff = "bdiff.quick:main"

[project.urls]
Homepage = "https://github.com/albertlieyingadrian/behavior-diff"
Source = "https://github.com/albertlieyingadrian/behavior-diff"
Documentation = "https://behavior-diff.mintlify.site"
Changelog = "https://github.com/albertlieyingadrian/behavior-diff/blob/main/CHANGELOG.md"
"Research note" = "https://albertlieyingadrian.github.io/steerlab/experiments/behavior-diff/report/"

[tool.uv.build-backend]
module-name = "bdiff"
# The wheel ships src/bdiff (with the default suite and the demo data); the sdist also carries the tests.
source-include = ["tests/**"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.11"
strict = true

[[tool.mypy.overrides]]
module = ["tinker", "tinker.*", "torch", "torch.*", "transformers", "transformers.*", "peft", "peft.*", "huggingface_hub", "huggingface_hub.*", "modal", "modal.*", "vllm", "vllm.*"]
ignore_missing_imports = true
